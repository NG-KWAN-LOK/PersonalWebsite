server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Filenames carry a content hash, so contents never change -> cache forever
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Fixed filenames (index.html, favicon/manifest/robots/logo) -> revalidate with origin every time
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
