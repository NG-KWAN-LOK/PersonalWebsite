name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up pnpm
        uses: pnpm/action-setup@v4

      - name: Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and Build
        run: pnpm install --frozen-lockfile && pnpm build

  deploy:
    name: Deploy to Cloud Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Cloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # WARNING: these flags must match the Makefile's deploy target exactly,
      #          otherwise manual and CI deploys will overwrite each other's configuration.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: personal-website
          region: asia-east1
          source: .
          project_id: ${{ secrets.GCP_PROJECT }}
          flags: --allow-unauthenticated --cpu=1 --memory=128Mi --min-instances=0 --max-instances=1 --concurrency=80
